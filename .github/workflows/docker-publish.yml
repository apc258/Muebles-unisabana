name: CI/CD Muebles Unisabana Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del código
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configuración de Java 17 (Instalación de entorno)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven' # Optimiza la instalación de dependencias en cada corrida

      # 3. Instalación de dependencias y Compilación
      - name: Install dependencies and Compile
        run: mvn clean compile

      # 4. Ejecución de Pruebas (Unit Tests)
      # Si una prueba falla, el pipeline se detiene aquí y no sube nada a Docker/Render
      - name: Run Tests
        run: mvn test

      # 5. Empaquetado del archivo JAR
      - name: Build JAR
        run: mvn package -DskipTests # SkipTests porque ya corrieron en el paso anterior

      # 6. Login en Docker Hub
      - name: Login to Docker Hub
        if: github.event_name == 'push' # Solo sube a Docker si es un push a master
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 7. Construcción de Imagen Docker y Push
      - name: Build and Push Docker Image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/Muebles-unisabana:latest

      # 8. Notificar a Render para el despliegue
      #- name: Trigger Render Deploy
        #if: github.event_name == 'push'
        #run: |
          #curl -f ${{ secrets.RENDER_DEPLOY_HOOK }}
