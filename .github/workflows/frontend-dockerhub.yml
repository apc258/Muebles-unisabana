name: Frontend DockerHub Publish

on:
  push:
    branches:
      - main
      - master
    paths:
      - frontend/**
      - .github/workflows/frontend-dockerhub.yml
  workflow_dispatch:

env:
  IMAGE_NAME: proyecto-muebles-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify-render:
    needs: build-and-push
    if: ${{ needs.build-and-push.result == 'success' && secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL != '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deploy (frontend)
        env:
          RENDER_FRONTEND_DEPLOY_HOOK_URL: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}
        run: |
          curl -fsS -X POST "$RENDER_FRONTEND_DEPLOY_HOOK_URL"
          echo "Render deploy hook for frontend triggered."

